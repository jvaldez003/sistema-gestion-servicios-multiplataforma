name: sistema_gestion_servicios_multiplataforma
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.2.0
  intl: ^0.19.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.2.4
  font_awesome_flutter: ^10.12.0
  google_fonts: ^8.0.2
  google_sign_in: ^6.2.1
  table_calendar: ^3.0.9
  image_picker: ^1.2.1
